name: Governance 64 scenarios

on:
  push:
    branches:
      - "test/governance-64-*"
    paths:
      - "CULTURA.md"
      - "MOP.md"
      - "governance/**"
      - "timeline/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/governance-64.yml"
  pull_request:
    branches:
      - "integration/mop-governance-v0.1"
    paths:
      - "CULTURA.md"
      - "MOP.md"
      - "governance/**"
      - "timeline/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/governance-64.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Existing executable tests
        run: python -m unittest discover -s tests -v
      - name: Execute 64 governance scenarios
        run: |
          python tools/run_governance_64.py \
            --repo-root . \
            --output-dir governance-test-results \
            --frozen-head "$GITHUB_SHA"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-64-results-${{ github.sha }}
          path: governance-test-results/
          if-no-files-found: error
