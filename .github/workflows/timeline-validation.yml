name: Timeline validation

on:
  pull_request:
    paths:
      - "timeline/**"
      - "tools/validate_timeline.py"
      - "tests/test_validate_timeline.py"
      - ".github/workflows/timeline-validation.yml"
  push:
    branches:
      - "mop/**"
      - "integration/**"
    paths:
      - "timeline/**"
      - "tools/validate_timeline.py"
      - "tests/test_validate_timeline.py"
      - ".github/workflows/timeline-validation.yml"

permissions:
  contents: read

jobs:
  tl005:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate repository timeline
        run: python tools/validate_timeline.py timeline --format json
